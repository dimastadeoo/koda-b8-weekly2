<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marketplace">
    <title>Proses Checkout</title>
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/asset/css/style.css">
    <link rel="stylesheet" href="/asset/css/checkout.css">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="sticky top-0 z-50" id="header">
    </header>
    <main>
        <section class="container-checkout">
            
            <div class="process-number-checkout">
                <div class="flex container-step">
                    <div class="step">
                        <div class="step-circle done">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check-icon lucide-check"><path d="M20 6 9 17l-5-5"/></svg>
                        </div>
                        <span class="step-label">Pengiriman</span>
                    </div>
                    <div class="step-line done"></div>
                </div>
                <div class="flex container-step">
                    <div class="step active">
                        <div class="step-circle">2</div>
                        <span class="step-label">Pembayaran</span>
                    </div>
                </div>
                <div class="step-line"></div>
                <div class="flex container-step">
                    <div class="step">
                        <div class="step-circle">3</div>
                        <span class="step-label">Konfirmasi</span>
                    </div>
                </div>
            </div>

            <div class="process-content-checkout">
                
                <div class="checkout-left">
                    <h2 class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card-icon lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                    </span>Metode Pembayaran</h2>
               
                    <div class="container-payment"> 
                        <label class="payment-item active">
                            <input type="radio" name="payment" checked>
                            <p>🏦 Virtual Account BCA</p>
                        </label>  
                        <label class="payment-item">
                            <input type="radio" name="payment">
                            <p>🏦 Virtual Account BNI</p>
                        </label>
                        <label class="payment-item">
                            <input type="radio" name="payment" >
                            <p>💳 Kartu Kredit / Debit</p>
                        </label>
                        <label class="payment-item ">
                            <input type="radio" name="payment" >
                            <p>📱 Gopay</p>
                        </label>
                        <label class="payment-item ">
                            <input type="radio" name="payment" >
                            <p>📱 Ovo</p>
                        </label>
                        <label class="payment-item ">
                            <input type="radio" name="payment" >
                            <p>📱 Dana</p>
                        </label>             
                    </div>

                    <div class="info-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-lock-icon lucide-lock"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        <p class="info-text">
                            Informasi pembayaranmu dienkripsi dengan SSL 256-bit. Kami tidak menyimpan data kartu kreditmu.
                        </p>
                    </div>

                    <div class="button-payment">
                        <button class="btn-back-checkout">
                            Kembali
                        </button>
                        <button class="btn-primary-checkout">Lanjut ke Pembayaran
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                        </button>
                    </div>
                </div>

                <div class="checkout-right">
                    <div class="summary-card">
                        <h3 class="summary-title">Ringkasan Pesanan</h3>
                        
                        <div class="product-mini">
                            <img src="/asset/img/item-1.png" alt="Headphone">
                            <div class="product-mini-info">
                                <h4>Headphone Wireless Premium</h4>
                            </div>
                            <span class="product-mini-qty">×1</span>
                        </div>

                        <div class="container-total-harga">
                            <div class="summary-line">
                                <span>Subtotal</span>
                                <span>Rp 450.000</span>
                            </div>
                            <div class="summary-line">
                                <span>Ongkir</span>
                                <span class="free-text">Gratis</span>
                            </div>
                            <div class="summary-line total">
                                <span>Total</span>
                                <span class="total-price">Rp 450.000</span>
                            </div>
                        </div>

                        <p class="secure-footer">🛡️ Pembayaran aman dan terenkripsi</p>
                    </div>
                </div>

            </div>
        </section> 
    </main>
    <footer id="footer">
    </footer> 
    
    <script type="text/javascript" src="/asset/js/header-footer.js"></script>
</body>
</html>
