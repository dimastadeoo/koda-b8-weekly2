<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marketplace">
    <title>Proses Checkout</title>
    <link rel="stylesheet" href="/asset/css/style.css">
    <link rel="stylesheet" href="/asset/css/checkout.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="sticky top-0 z-50" id="header">
    </header>
    <main>
        <section class="container-checkout">
            
            <div class="process-number-checkout">
                <div class="flex container-step">
                    <div class="step active">
                        <div class="step-circle">1</div>
                        <span class="step-label">Pengiriman</span>
                    </div>
                    <div class="step-line"></div>
                </div>
                <div class="flex container-step">
                    <div class="step">
                        <div class="step-circle">2</div>
                        <span class="step-label">Pembayaran</span>
                    </div>
                </div>
                <div class="step-line"></div>
                <div class="flex container-step">
                    <div class="step">
                        <div class="step-circle">3</div>
                        <span class="step-label">Konfirmasi</span>
                    </div>
                </div>
            </div>

            <div class="process-content-checkout">
                
                <form class="checkout-left">
                    <h2 class="card-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-truck-icon lucide-truck"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                    Alamat Pengiriman</h2>
               
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="fullName">Nama Penerima *</label>
                            <input id="fullName" name="fullName" type="text" value="" required>
                        </div>
                        <div class="form-group">
                            <label for="noHp">Nomor Telepon *</label>
                            <input id="noHp" name="noHp" type="text" value="" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="email">Email *</label>
                            <input id="email" name="email" type="email" value="" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="alamat">Alamat Lengkap *</label>
                            <input id="alamat" name="alamat" type="text" value="" required>
                        </div>
                        <div class="form-group">
                            <label for="city">Kota *</label>
                            <input id="city" name="city" type="text" value="" required>
                        </div>
                        <div class="form-group">
                            <label for="provinsi">Provinsi *</label>
                            <input id="provinsi" name="provinsi" type="text" value="" required>
                        </div>
                        <div class="form-group">
                            <label for="kodePos">Kode Pos *</label>
                            <input id="kodePos" name="kodePos" type="text" value="" required>
                        </div>
                        <div class="form-group">
                            <label for="note">Catatan (opsional)</label>
                            <input id="note" name="note" type="text" placeholder="">
                        </div>
                    </div>

                    <div class="container-shiping">
                        <h2 class="card-title">Metode Pengiriman</h2>
                        
                        <div class="shipping-options">
                            <label class="shipping-item active">
                                <input type="radio" name="shipping" value="JNE Reguler" checked>
                                <div class="shipping-details">
                                    <span class="shipping-name">JNE Reguler</span>
                                    <span class="shipping-eta">3-5 hari kerja</span>
                                </div>
                                <span class="shipping-price">GRATIS</span>
                            </label>

                            <label class="shipping-item">
                                <input type="radio" name="shipping" value="JNE Express">
                                <div class="shipping-details">
                                    <span class="shipping-name">JNE Express</span>
                                    <span class="shipping-eta">1-2 hari kerja</span>
                                </div>
                                <span class="shipping-price">GRATIS</span>
                            </label>

                            <label class="shipping-item">
                                <input type="radio" name="shipping" value="Same Day Delivery">
                                <div class="shipping-details">
                                    <span class="shipping-name">Same Day Delivery</span>
                                    <span class="shipping-eta">Hari ini (sebelum 16:00)</span>
                                </div>
                                <span class="shipping-price">GRATIS</span>
                            </label>
                        </div>
                    </div>
                    <button  type="submit" class="btn-primary-checkout">Lanjut ke Pembayaran
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </form>

                <div class="checkout-right">
                    <div class="summary-card">
                        <h3 class="summary-title">Ringkasan Pesanan</h3>
                        
                        <div class="product-mini">
                            <img src="/asset/img/item-1.png" alt="Headphone">
                            <div class="product-mini-info">
                                <h4>Headphone Wireless Premium</h4>
                            </div>
                            <span class="product-mini-qty">×1</span>
                        </div>

                        <div class="container-total-harga">
                            <div class="summary-line">
                                <span>Subtotal</span>
                                <span>Rp 450.000</span>
                            </div>
                            <div class="summary-line">
                                <span>Ongkir</span>
                                <span class="free-text">Gratis</span>
                            </div>
                            <div class="summary-line total">
                                <span>Total</span>
                                <span class="total-price">Rp 450.000</span>
                            </div>
                        </div>

                        <p class="secure-footer">🛡️ Pembayaran aman dan terenkripsi</p>
                    </div>
                </div>

            </div>
        </section> 
    </main>
    <footer id="footer">
    </footer> 
    
    <script type="module" src="/asset/js/app.js"></script>
</body>
</html>
