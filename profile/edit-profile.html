<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Marketplace">
    <title>Wishlist Saya</title>
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/asset/css/style.css">
    <link rel="stylesheet" href="/asset/css/profile.css">
</head>
<body>
    <header class="header" id="header">
    </header>
    <main>
       <section class="flex container-profile">
            <div class="left-profile">
                <div class="grid gap-3 padding-20 radius-16 bg-white">
                    <div class="logo-profile flex centerAll">
                        B
                    </div>

                    <div class="grid">
                        <h2 class="textTitle placeCenter">
                            Budi Santoso
                        </h2>
                        <p class="textDesc placeCenter">
                            budi@email.com
                        </p>

                    </div>

                    <div class="flex gap-4 top-border-cont paddingTop-4 centerContent">
                        <div class="grid">
                                <h2 class="textTitle placeCenter">
                                2
                            </h2>
                            <p class="textDesc placeCenter">
                               Pesanan
                            </p>
                        </div>
                        <div class="grid">
                                <h2 class="textTitle placeCenter">
                                0
                            </h2>
                            <p class="textDesc placeCenter">
                               Wishlist
                            </p>
                        </div>
                    </div>

                </div>

                <div class="grid radius-16 bg-white">
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-bag-icon lucide-shopping-bag"><path d="M16 10a4 4 0 0 1-8 0"/><path d="M3.103 6.034h17.794"/><path d="M3.4 5.467a2 2 0 0 0-.4 1.2V20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6.667a2 2 0 0 0-.4-1.2l-2-2.667A2 2 0 0 0 17 2H7a2 2 0 0 0-1.6.8z"/></svg>
                        Pesanan Saya
                        <svg class="margin-left-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </div>
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-heart-icon lucide-heart"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                        Wishlist
                        <svg class="margin-left-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </div>
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-map-pin-icon lucide-map-pin"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>
                        Alamat Saya
                        <svg class="margin-left-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </div>
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-credit-card-icon lucide-credit-card"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
                        Metode Pembayaran
                        <svg class="margin-left-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </div>
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem nav-checked">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings-icon lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                        Pengaturan Profil
                        <svg class="margin-left-auto" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
                    </div>
                    <div class="pointer flex padding-14-16 gap-3 textNav centerItem color-red">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-log-out-icon lucide-log-out"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
                        Keluar
                    </div>
                </div>
            </div>
            <div class="right-profile-wishlist">
                <div class="flex centerItem betwen-content">
                    <h1 class="textTitlePage">
                        Pengaturan profil
                    </h1>

                    <div class="flex centerItem centerContent btn-tambah-alamat textNav btn-simpan gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1A73E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>
                        Simpan
                    </div>
                </div>
                
                <div class="grid container-form-edit bg-white radius-16 widthFull">
                    <div class="flex centerItem gap-4">
                        <div class="logo-profile flex centerContent centerItem">
                            B
                        </div> 
                        <a href="#" class="textDesc color-blue">
                            Ganti Foto Profil
                        </a>                       
                    </div>
                    <div class="grid gap-1x widthFull">
                        <label for="name" class="textDesc">
                            Nama Lengkap
                        </label>
                        <input class="input-data" id="name" type="text" value="Dimas Tadeo">
                    </div>

                    <div class="grid gap-1x widthFull">
                        <label for="email" class="textDesc">
                            Email
                        </label>
                        <input class="input-data" id="email" type="email" value="dimas@contoh.com">
                    </div>

                    <div class="grid gap-1x widthFull">
                        <label for="noTelp" class="textDesc">
                            Nomor Telepon
                        </label>
                        <input class="input-data" id="noTelp" type="number" value="086745231908">
                    </div>

                    <div class="grid gap-1x widthFull">
                        <label for="birth" class="textDesc">
                            Tanggal Lahir
                        </label>
                        <input class="input-data" id="birth" type="date" value="12/12/2020">
                    </div>

                    <div class="grid gap-1x widthFull">
                        <label for="gender" class="textDesc">
                            Jenis Kelamin
                        </label>
                        <input class="input-data" id="gender" type="text" value="Laki - Laki">
                    </div>

                </div>

                <div class="grid container-form-edit bg-white radius-16 gap-14 widthFull">
                    <p class="textTitle">
                        Keamanan Akun
                    </p>
                    <a href="#" class="textDesc color-blue">
                        Ubah kata sandi
                    </a>
                    <a href="#" class="textDesc color-blue">
                        Aktifkan verifikasi 2 langkah
                    </a>

                </div>

            </div>
       </section> 
    </main>
    <footer id="footer">
    </footer> 
    
    <script type="text/javascript" src="/asset/js/header-footer.js"></script>
</body>
</html>
